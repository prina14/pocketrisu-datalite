<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo_16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo_32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/logo_256.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="description" content="An AI frontend for both light and core users.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; object-src 'none'; require-trusted-types-for 'script'; trusted-types plugin-policy;"> -->
    <title>PocketRisu</title>
    <!-- First screen has no external CSS, fonts, images or application dependency. -->
    <!-- startup-style -->
  </head>

  <body>
    <div id="app">
      <noscript>
        <div class="noscript">
          <h1>JavaScript is disabled</h1>
          <p>Please enable JavaScript to use this website.</p>
        </div>
      </noscript>
    </div>
    <noscript><style>#preloading{display:none}</style></noscript>
    <!-- Public layout only. Private character names appear after authentication. -->
    <section id="preloading" class="startup-shell" aria-busy="true" aria-label="PocketRisu">
      <!-- startup-layout -->
      <button id="startup-retry" type="button" hidden>Reload</button>
    </section>
    <!-- startup-presentation -->
    <script>
      // Runs without waiting for the application entry. This records a render
      // opportunity, not authentication, chat readiness or physical display.
      requestAnimationFrame(function () {
        setTimeout(function () {
          try { performance.measure('pocketrisu:startup:navigation-to-shell-frame', { start: 0, end: performance.now() }); } catch (_) {}
        }, 0);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
