<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo_16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo_32.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/logo_256.png" />
    <link rel="manifest" href="/manifest.json" crossorigin="use-credentials" />
    <meta name="description" content="An AI frontend for both light and core users.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; object-src 'none'; require-trusted-types-for 'script'; trusted-types plugin-policy;"> -->
    <title>PocketRisu</title>
    <!-- First screen has no external CSS, fonts, images or application dependency. -->
    <style>
      html,body,#app{margin:0;width:100%;height:100%;background:#15171c}
      .startup-shell{box-sizing:border-box;width:100%;min-height:100%;background:#15171c;color:#e8e9ed;font:16px/1.5 system-ui,sans-serif}
      #preloading{position:fixed;inset:0;z-index:50;overflow:auto}
      .startup-shell *{box-sizing:border-box}
      .startup-shell header{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1.1rem 1.5rem;border-bottom:1px solid #ffffff18}
      .startup-shell strong{font-size:1.15rem;letter-spacing:-.02em}
      .startup-shell .shell-status{font-size:.8rem;color:#b8bfcd}
      .startup-shell .shell-content{max-width:68rem;margin:auto;padding:1.5rem}
      .startup-shell h1{font-size:1.15rem;font-weight:600;margin:0 0 .4rem}
      .startup-shell p{font-size:.85rem;color:#b8bfcd;margin:0 0 1.5rem}
      .startup-shell .shell-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.75rem}
      .startup-shell .shell-card{display:flex;align-items:center;gap:.7rem;padding:.8rem;border:1px solid #ffffff18;border-radius:.75rem}
      .startup-shell .shell-avatar{width:2.5rem;height:2.5rem;flex-shrink:0;background:#ffffff0d;border-radius:.6rem}
      .startup-shell .shell-line{height:.65rem;width:60%;background:#ffffff12;border-radius:.3rem}
      .startup-shell .shell-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .startup-shell button{font:inherit;color:inherit;background:#303748;border:1px solid #ffffff30;border-radius:.5rem;padding:.6rem 1rem;cursor:pointer}
      .startup-shell button[hidden]{display:none}
      @media(max-width:480px){.startup-shell header,.startup-shell .shell-content{padding:1rem}}
    </style>
  </head>

  <body>
    <div id="app">
      <noscript>
        <div class="noscript">
          <h1>JavaScript is disabled</h1>
          <p>Please enable JavaScript to use this website.</p>
        </div>
      </noscript>
    </div>
    <noscript><style>#preloading{display:none}</style></noscript>
    <!-- Public layout only. Private character names appear after authentication. -->
    <section id="preloading" class="startup-shell" aria-busy="true" aria-label="PocketRisu">
      <header><strong>PocketRisu</strong><span class="shell-status" role="status" id="startup-status">Connecting…</span></header>
      <div class="shell-content">
        <h1>Characters</h1>
        <p>Preparing your conversations…</p>
        <div class="shell-grid" aria-hidden="true">
          <div class="shell-card"><span class="shell-avatar"></span><span class="shell-line"></span></div>
          <div class="shell-card"><span class="shell-avatar"></span><span class="shell-line"></span></div>
          <div class="shell-card"><span class="shell-avatar"></span><span class="shell-line"></span></div>
          <div class="shell-card"><span class="shell-avatar"></span><span class="shell-line"></span></div>
        </div>
        <button id="startup-retry" type="button" hidden>Reload</button>
      </div>
    </section>
    <script>
      // Runs without waiting for the application entry. This records a render
      // opportunity, not authentication, chat readiness or physical display.
      requestAnimationFrame(function () {
        setTimeout(function () {
          try { performance.measure('pocketrisu:startup:navigation-to-shell-frame', { start: 0, end: performance.now() }); } catch (_) {}
        }, 0);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
